<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Auth - Want Some Tea?</title>
<meta name="description" content="Log in or sign up to Want Some Tea?  a cozy social feed for friendly updates." />
<link rel="icon" type="image/png" href="/assets/favicon.png" />
  <link rel="stylesheet" href="/assets/styles.css" />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="min-h-dvh flex flex-col">
   
  <header class="card mx-auto max-w-6xl mt-4 mb-6">
  <nav class="flex items-center justify-between px-20 py-2 gap-10">
    <a href="/" class="flex items-center gap-3">
      <img src="/assets/logo.png" alt="Want the tea logo" class="w-32 sm:w-40" />
    </a>

    <ul class="hidden md:flex items-center gap-6 text-sm font-medium">
      <li><a href="/" class="nav-link active" aria-current="page">Auth</a></li>
      <li><a href="/feed/" class="nav-link">Feed</a></li>
      <li><a href="/profile/" class="nav-link">Profile</a></li>
    </ul>

    <details class="relative md:hidden">
      <summary
        class="list-none p-2 rounded-md hover:bg-gray-100 cursor-pointer"
        aria-label="Open menu"
      >
        <span class="block w-6 h-0.5 bg-(--text) mb-1"></span>
        <span class="block w-6 h-0.5 bg-(--text) mb-1"></span>
        <span class="block w-6 h-0.5 bg-(--text)"></span>
      </summary>

      <div class="absolute right-0 mt-2 w-40 card p-2">
        <ul class="flex flex-col gap-1 text-sm font-medium">
          <li><a href="/" class="nav-link block px-2 py-2 rounded-md active" aria-current="page">Auth</a></li>
          <li><a href="/feed/" class="nav-link block px-2 py-2 rounded-md">Feed</a></li>
          <li><a href="/profile/" class="nav-link block px-2 py-2 rounded-md">Profile</a></li>
        </ul>
      </div>
    </details>
  </nav>
</header>

  <main class="flex-1 max-w-5xl mx-auto p-6 space-y-6">
  <h1 class="text-2xl font-semibold mb-6 text-center">Log in or Register</h1>
  

  <form action="/profile" method="get" class="card p-4">
    <div>
      <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autocomplete="email"
        placeholder="you@example.com"
        class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500"
      />
    </div>

    <div>
      <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
      <input
        id="password"
        name="password"
        type="password"
        required
        minlength="8"
        autocomplete="current-password"
        placeholder="At least 8 characters"
        class="w-full border border-gray-300 rounded-md p-2 outline-none focus:ring-2 focus:ring-blue-500"
      />
     
      <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters long.</p>
    </div>

    
    <button
      type="submit"
      class="btn-brand"
    >
      Log in / Register
    </button>
  </form>
</main>
<footer class="text-center text-sm text-(--muted) py-6 opacity-80">
  © 2025 Want Some Tea?
</footer>
</body>
</html>
